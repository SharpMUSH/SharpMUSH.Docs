<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 250" width="975" height="250" role="img" aria-labelledby="t d">
  <title id="t">How a report on a gallery image reaches staff</title>
  <desc id="d">A visitor signed in to the portal chooses Report on an image and writes a reason. The server checks that the event handler has a GALLERY`REPORT attribute and runs it, with the reporter as the enactor. The bundled jobs package's attribute files a job in the Staff bucket; a game can write its own instead. With no attribute, the portal shows no Report button.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; font-size: 15px; fill: #0f172a; }
    .small { font-size: 13px; fill: #334155; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .check { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
    .ok { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.5; }
    .no { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; }
    .line { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <rect x="0" y="0" width="975" height="250" rx="12" fill="#f8fafc"/>

  <rect class="box" x="20" y="70" width="180" height="70" rx="8"/>
  <text x="110" y="98" text-anchor="middle">Visitor on the portal</text>
  <text class="small" x="110" y="120" text-anchor="middle">Report, with a reason</text>
  <path class="line" d="M200 105 H258" marker-end="url(#arrow)"/>

  <rect class="check" x="262" y="60" width="230" height="90" rx="8"/>
  <text x="377" y="88" text-anchor="middle">Server</text>
  <text class="small" x="377" y="110" text-anchor="middle">Does the event handler have</text>
  <text class="small code" x="377" y="130" text-anchor="middle">GALLERY`REPORT?</text>

  <path class="line" d="M492 90 H560 V55 H588" marker-end="url(#arrow)"/>
  <text class="small" x="530" y="80" text-anchor="middle">yes</text>
  <rect class="box" x="592" y="20" width="170" height="70" rx="8"/>
  <text x="677" y="48" text-anchor="middle">Event handler</text>
  <text class="small" x="677" y="70" text-anchor="middle">runs it as the reporter</text>
  <path class="line" d="M762 55 H808" marker-end="url(#arrow)"/>
  <rect class="ok" x="812" y="20" width="145" height="70" rx="8"/>
  <text x="884" y="48" text-anchor="middle">A job in Staff</text>
  <text class="small" x="884" y="70" text-anchor="middle">or your own code</text>

  <path class="line" d="M492 120 H560 V185 H588" marker-end="url(#arrow)"/>
  <text class="small" x="530" y="140" text-anchor="middle">no</text>
  <rect class="no" x="592" y="150" width="365" height="70" rx="8"/>
  <text x="774" y="178" text-anchor="middle">The game takes no reports</text>
  <text class="small" x="774" y="200" text-anchor="middle">The portal shows no Report button</text>
</svg>
