<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">SharpMUSH single-host deployment architecture</title>
  <desc id="desc">Three horizontal lanes show player traffic, runtime services and state, and recovery storage. Browser traffic reaches Server and SocketServer through web ingress; telnet reaches SocketServer directly. Server and SocketServer exchange messages through NATS, SocketServer calls RenderingWorker, and Server owns LMDB and wiki assets. Server creates point-in-time world copies which Restic sends with wiki assets to off-host storage. Health checks and Prometheus observe runtime services.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#47647b"/></marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#38724a"/></marker>
    <style>
      .canvas{fill:#e9eef4}.lane{fill:#f8fafc;stroke:#c7d2df;stroke-width:2;rx:18}.lane-title{font:700 22px system-ui,sans-serif;fill:#263746;letter-spacing:.04em}
      .service{fill:#fff;stroke:#47647b;stroke-width:2.5;rx:14}.client{fill:#eef8f1;stroke:#38724a;stroke-width:2.5;rx:14}.state{fill:#fff7e7;stroke:#986b28;stroke-width:2.5;rx:14}.ops{fill:#f3effb;stroke:#7457a6;stroke-width:2.5;rx:14}
      .name{font:700 20px system-ui,sans-serif;fill:#172532}.detail{font:16px system-ui,sans-serif;fill:#4a5c6d}.edge{fill:none;stroke:#47647b;stroke-width:3;marker-end:url(#arrow)}.edge-green{fill:none;stroke:#38724a;stroke-width:3;marker-end:url(#arrow-green)}.observe{fill:none;stroke:#7457a6;stroke-width:2.5;stroke-dasharray:8 7}.label-box{fill:#f8fafc;stroke:#c7d2df;stroke-width:1;rx:6}.edge-label{font:600 15px system-ui,sans-serif;fill:#405568;paint-order:stroke fill;stroke:#f8fafc;stroke-width:9;stroke-linejoin:round}.gap-label{stroke:#e9eef4}.legend{font:15px system-ui,sans-serif;fill:#526575}
    </style>
  </defs>

  <rect width="1200" height="900" class="canvas"/>

  <rect x="24" y="24" width="1152" height="334" class="lane"/>
  <text x="52" y="61" class="lane-title">1 · PLAYER TRAFFIC</text>
  <rect x="62" y="94" width="190" height="100" class="client"/>
  <text x="157" y="132" text-anchor="middle" class="name">Browser</text><text x="157" y="162" text-anchor="middle" class="detail">HTTPS · SignalR · WSS</text>
  <rect x="322" y="94" width="210" height="100" class="service"/>
  <text x="427" y="132" text-anchor="middle" class="name">Web ingress</text><text x="427" y="162" text-anchor="middle" class="detail">Caddy or Cloudflare</text>
  <rect x="612" y="80" width="230" height="114" class="service"/>
  <text x="727" y="119" text-anchor="middle" class="name">SharpMUSH.Server</text><text x="727" y="149" text-anchor="middle" class="detail">portal · API · SignalR</text>
  <rect x="902" y="80" width="230" height="114" class="service"/>
  <text x="1017" y="119" text-anchor="middle" class="name">SocketServer</text><text x="1017" y="149" text-anchor="middle" class="detail">telnet · WebSocket owner</text>
  <rect x="62" y="262" width="190" height="96" class="client"/>
  <text x="157" y="300" text-anchor="middle" class="name">MU* client</text><text x="157" y="330" text-anchor="middle" class="detail">Telnet :4201</text>
  <path d="M252 144 H322" class="edge-green"/><text x="287" y="132" text-anchor="middle" class="edge-label">web</text>
  <path d="M532 124 H612" class="edge"/><text x="572" y="112" text-anchor="middle" class="edge-label">HTTP</text>
  <path d="M532 164 C650 220 790 220 902 164" class="edge"/><rect x="692" y="199" width="50" height="27" class="label-box"/><text x="717" y="218" text-anchor="middle" class="edge-label">/ws</text>
  <path d="M252 310 H860 C885 310 885 176 902 176" class="edge-green"/><text x="474" y="298" text-anchor="middle" class="edge-label">direct TCP</text>

  <rect x="24" y="382" width="1152" height="262" class="lane"/>
  <text x="52" y="419" class="lane-title">2 · RUNTIME SERVICES AND STATE</text>
  <rect x="70" y="464" width="220" height="108" class="ops"/>
  <text x="180" y="502" text-anchor="middle" class="name">Observability</text><text x="180" y="532" text-anchor="middle" class="detail">health · Prometheus</text>
  <rect x="365" y="464" width="240" height="108" class="state"/>
  <text x="485" y="502" text-anchor="middle" class="name">NATS + JetStream</text><text x="485" y="532" text-anchor="middle" class="detail">messages · bounded replay</text>
  <rect x="680" y="450" width="220" height="108" class="service"/>
  <text x="790" y="488" text-anchor="middle" class="name">RenderingWorker</text><text x="790" y="518" text-anchor="middle" class="detail">private Unix socket</text>
  <rect x="680" y="578" width="190" height="54" class="state"/>
  <text x="775" y="612" text-anchor="middle" class="name">LMDB world</text>
  <rect x="930" y="578" width="190" height="54" class="state"/>
  <text x="1025" y="612" text-anchor="middle" class="name">Wiki assets</text>
  <path d="M727 194 V330 C727 360 485 360 485 464" class="edge"/><text x="605" y="344" text-anchor="middle" class="edge-label">commands + output</text>
  <path d="M1017 194 V350 C1017 372 515 372 515 464" class="edge"/>
  <path d="M1017 194 V430 C1017 446 900 446 900 472" class="edge"/><rect x="923" y="411" width="74" height="27" class="label-box"/><text x="960" y="430" text-anchor="middle" class="edge-label">HTTP/2</text>
  <path d="M700 194 V430 H640 V605 H680" class="edge"/><text x="630" y="594" text-anchor="end" class="edge-label">transactions</text>
  <path d="M750 194 V585 C750 558 930 558 930 590" class="edge"/><text x="905" y="548" text-anchor="middle" class="edge-label">uploads</text>
  <path d="M290 496 H365" class="observe"/><path d="M180 464 V438 H790 V450" class="observe"/><path d="M180 464 V438 H727 V194" class="observe"/><path d="M180 464 V424 H1017 V194" class="observe"/>

  <rect x="24" y="670" width="1152" height="200" class="lane"/>
  <text x="52" y="707" class="lane-title">3 · RECOVERY PATH</text>
  <rect x="126" y="746" width="230" height="88" class="state"/>
  <text x="241" y="780" text-anchor="middle" class="name">World copies</text><text x="241" y="808" text-anchor="middle" class="detail">LMDB point in time</text>
  <rect x="486" y="746" width="200" height="88" class="ops"/>
  <text x="586" y="780" text-anchor="middle" class="name">Restic</text><text x="586" y="808" text-anchor="middle" class="detail">read-only sources</text>
  <rect x="816" y="746" width="240" height="88" class="state"/>
  <text x="936" y="780" text-anchor="middle" class="name">Off-host storage</text><text x="936" y="808" text-anchor="middle" class="detail">encrypted snapshots</text>
  <path d="M775 632 V650 C775 662 241 662 241 746" class="edge"/><text x="500" y="652" text-anchor="middle" class="edge-label gap-label">server-created copy</text>
  <path d="M356 790 H486" class="edge"/><path d="M686 790 H816" class="edge"/>
  <path d="M1025 632 V650 C1025 680 640 680 640 746" class="edge"/><text x="850" y="679" text-anchor="middle" class="edge-label">wiki assets</text>

  <line x1="55" y1="884" x2="91" y2="884" class="edge"/><text x="105" y="889" class="legend">runtime/data flow</text>
  <line x1="260" y1="884" x2="296" y2="884" class="observe"/><text x="310" y="889" class="legend">observation only</text>
</svg>
