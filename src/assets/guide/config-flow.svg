<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
  <title id="t">How +config finds and changes a setting</title>
  <desc id="d">The Config Registry holds one attribute per system, naming the object that system keeps its settings on. +config looks the system up there, reads the setting's type and limits from that object, checks the new value, and writes it back to the same object, where the system's own code reads it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--dg-muted)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" rx="12" style="fill:var(--dg-canvas)"/>

  <rect x="24" y="24" width="200" height="64" rx="8" style="fill:var(--dg-green-fill);stroke:var(--dg-green-ink)"/>
  <text x="124" y="50" text-anchor="middle" font-weight="600" style="fill:var(--dg-green-ink)">Staff</text>
  <text x="124" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-green-ink)">+config time/zone=UTC</text>

  <rect x="24" y="200" width="200" height="76" rx="8" style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-ink)"/>
  <text x="124" y="226" text-anchor="middle" font-weight="600" style="fill:var(--dg-blue-ink)">Config Registry</text>
  <text x="124" y="248" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-blue-ink)">SYSTEM`TIME = Clock</text>
  <text x="124" y="266" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-blue-ink)">SYSTEM`STATUS = Status</text>

  <rect x="300" y="24" width="190" height="64" rx="8" style="fill:var(--dg-amber-fill);stroke:var(--dg-amber-ink)"/>
  <text x="395" y="50" text-anchor="middle" font-weight="600" style="fill:var(--dg-amber-ink)">+config</text>
  <text x="395" y="72" text-anchor="middle" font-size="12" style="fill:var(--dg-amber-ink)">finds, checks, writes</text>

  <rect x="540" y="130" width="196" height="146" rx="8" style="fill:var(--dg-canvas);stroke:var(--dg-text)"/>
  <text x="638" y="156" text-anchor="middle" font-weight="600" style="fill:var(--dg-text)">Clock (the system's object)</text>
  <text x="556" y="184" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-text)">DATA`CONFIG`ZONE</text>
  <text x="572" y="204" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-text)">`TYPE = timezone</text>
  <text x="572" y="224" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-text)">`DEFAULT = UTC</text>
  <text x="572" y="244" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-text)">`DESCRIPTION</text>
  <text x="556" y="264" font-size="12" style="fill:var(--dg-muted)">its own code reads it with v()</text>

  <path d="M226 56 L298 56" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <path d="M340 90 L340 120 L170 120 L170 198" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <text x="250" y="112" text-anchor="middle" font-size="12" style="fill:var(--dg-muted)">1. which object?</text>
  <path d="M430 90 L430 170 L538 170" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <text x="420" y="165" text-anchor="end" font-size="12" style="fill:var(--dg-muted)">2. type and limits</text>
  <path d="M460 90 L460 235 L538 235" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <text x="450" y="230" text-anchor="end" font-size="12" style="fill:var(--dg-muted)">3. writes the checked value</text>
</svg>
