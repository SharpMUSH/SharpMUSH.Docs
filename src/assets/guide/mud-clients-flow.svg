<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
<title id="t">How GMCP moves between a MUD client and the game</title>
<desc id="d">A MUD client such as Mudlet talks GMCP to the socket server. The socket server keeps the client's Core.Supports list, passes it and what the client sends to the engine over NATS, and sends Client.Media.Default when media_base_url is set. The engine stores the list for gmcpsupports(), raises events such as OBJECT`MOVE and SOCKET`GMCP, runs the event handler's WATCH` attributes when a watched attribute changes, and the softcode packages gmcp-room, gmcp-comm, gmcp-items, gmcp-char and mudlet-client answer them by calling oob() with supported. The engine sends those frames back through the socket server to the client. The rendering worker turns sound() and music() in a line into Client.Media.Play and Stop frames, which the socket server sends just before the line.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
</defs>
<rect width="900" height="380" rx="12" fill="#f8fafc"/>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#1e293b">
  <text x="24" y="34" font-size="15" font-weight="600">The player's computer</text>
  <text x="250" y="34" font-size="15" font-weight="600">Connection side</text>
  <text x="560" y="34" font-size="15" font-weight="600">The game</text>

  <rect x="24" y="56" width="180" height="120" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="38" y="82" font-weight="600">MUD client</text>
  <text x="38" y="104" font-size="12" fill="#475569">Mudlet, TinTin++,</text>
  <text x="38" y="120" font-size="12" fill="#475569">Blightmud, MUSHclient</text>
  <text x="38" y="146" font-size="12" fill="#475569">map, gauges, chat,</text>
  <text x="38" y="162" font-size="12" fill="#475569">inventory, sound</text>

  <rect x="250" y="56" width="250" height="120" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="264" y="82" font-weight="600">Socket server</text>
  <text x="264" y="104" font-size="12" fill="#475569">agrees to GMCP, keeps the</text>
  <text x="264" y="120" font-size="12" fill="#475569">client's Core.Supports list,</text>
  <text x="264" y="136" font-size="12" fill="#475569">sends Client.Media.Default</text>
  <text x="264" y="152" font-size="12" fill="#475569">from media_base_url</text>

  <rect x="250" y="236" width="250" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="264" y="262" font-weight="600">Rendering worker</text>
  <text x="264" y="284" font-size="12" fill="#475569">turns sound(), music() and</text>
  <text x="264" y="300" font-size="12" fill="#475569">stopsound() into Client.Media</text>
  <text x="264" y="316" font-size="12" fill="#475569">frames sent before the line</text>

  <rect x="560" y="56" width="316" height="120" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="574" y="82" font-weight="600">Engine</text>
  <text x="574" y="104" font-size="12" fill="#475569">stores the list for gmcpsupports(),</text>
  <text x="574" y="120" font-size="12" fill="#475569">maps exits with exitmap(), raises</text>
  <text x="574" y="136" font-size="12" fill="#475569">events, and sends what oob() is given</text>
  <text x="574" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1d4ed8">oob(who, package, json, supported)</text>

  <rect x="560" y="236" width="316" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="574" y="262" font-weight="600">Softcode packages</text>
  <text x="574" y="284" font-size="12" fill="#475569">gmcp-room, gmcp-comm, gmcp-items,</text>
  <text x="574" y="300" font-size="12" fill="#475569">gmcp-char, mudlet-client: shape the</text>
  <text x="574" y="316" font-size="12" fill="#475569">game's data into the GMCP bodies</text>

  <line x1="204" y1="100" x2="246" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="248" y1="132" x2="208" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="210" y="88" font-size="11" fill="#475569">GMCP</text>

  <line x1="500" y1="100" x2="556" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="558" y1="132" x2="504" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="514" y="88" font-size="11" fill="#475569">NATS</text>

  <line x1="375" y1="236" x2="375" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="383" y="212" font-size="11" fill="#475569">text and frames</text>

  <line x1="680" y1="176" x2="680" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="586" y="210" font-size="11" fill="#475569">events</text>
  <line x1="770" y1="232" x2="770" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="778" y="210" font-size="11" fill="#475569">oob()</text>
</g>
</svg>
