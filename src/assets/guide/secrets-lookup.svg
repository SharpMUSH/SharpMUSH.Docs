<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
  <title id="t">Where the server finds a secret's value</title>
  <desc id="d">The server looks first for an environment variable, then for a file in the secrets directory, then for the value stored in the world, which it decrypts with the key ring kept beside the world. The first one found is used.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--dg-muted)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" rx="12" style="fill:var(--dg-canvas)"/>

  <rect x="24" y="24" width="210" height="64" rx="8" style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-ink)"/>
  <text x="129" y="50" text-anchor="middle" font-weight="600" style="fill:var(--dg-blue-ink)">1. Environment variable</text>
  <text x="129" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-blue-ink)">SHARPMUSH_SECRET_SQL_PASSWORD</text>

  <rect x="24" y="118" width="210" height="64" rx="8" style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-ink)"/>
  <text x="129" y="144" text-anchor="middle" font-weight="600" style="fill:var(--dg-blue-ink)">2. File</text>
  <text x="129" y="166" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" style="fill:var(--dg-blue-ink)">/run/secrets/sql.password</text>

  <rect x="24" y="212" width="210" height="64" rx="8" style="fill:var(--dg-amber-fill);stroke:var(--dg-amber-ink)"/>
  <text x="129" y="238" text-anchor="middle" font-weight="600" style="fill:var(--dg-amber-ink)">3. Stored in the world</text>
  <text x="129" y="260" text-anchor="middle" font-size="12" style="fill:var(--dg-amber-ink)">encrypted, set with @secret</text>

  <path d="M129 88 L129 116" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <text x="139" y="107" font-size="12" style="fill:var(--dg-muted)">not set</text>
  <path d="M129 182 L129 210" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <text x="139" y="201" font-size="12" style="fill:var(--dg-muted)">not set</text>

  <rect x="300" y="212" width="190" height="64" rx="8" stroke-dasharray="5 3" style="fill:var(--dg-amber-fill);stroke:var(--dg-amber-ink)"/>
  <text x="395" y="238" text-anchor="middle" font-weight="600" style="fill:var(--dg-amber-ink)">Key ring</text>
  <text x="395" y="260" text-anchor="middle" font-size="12" style="fill:var(--dg-amber-ink)">beside the world, not in it</text>
  <path d="M298 244 L236 244" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <text x="267" y="236" text-anchor="middle" font-size="12" style="fill:var(--dg-muted)">decrypts</text>

  <rect x="540" y="118" width="196" height="64" rx="8" style="fill:var(--dg-green-fill);stroke:var(--dg-green-ink)"/>
  <text x="638" y="144" text-anchor="middle" font-weight="600" style="fill:var(--dg-green-ink)">Server code</text>
  <text x="638" y="166" text-anchor="middle" font-size="12" style="fill:var(--dg-green-ink)">gets the first value found</text>

  <path d="M236 56 L520 56 L600 116" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <path d="M236 150 L536 150" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
  <path d="M492 230 L520 230 L600 184" stroke-width="1.5" fill="none" marker-end="url(#a)" style="stroke:var(--dg-muted)"/>
</svg>
