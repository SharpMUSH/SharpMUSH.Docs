<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
  <title id="t">Where the server finds a secret's value</title>
  <desc id="d">The server looks first for an environment variable, then for a file in the secrets directory, then for the value stored in the world, which it decrypts with the key ring kept beside the world. The first one found is used.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" rx="12" fill="#f8fafc"/>

  <rect x="24" y="24" width="210" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="129" y="50" text-anchor="middle" font-weight="600" fill="#0c4a6e">1. Environment variable</text>
  <text x="129" y="72" text-anchor="middle" fill="#0c4a6e" font-family="ui-monospace, monospace" font-size="12">SHARPMUSH_SECRET_SQL_PASSWORD</text>

  <rect x="24" y="118" width="210" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="129" y="144" text-anchor="middle" font-weight="600" fill="#0c4a6e">2. File</text>
  <text x="129" y="166" text-anchor="middle" fill="#0c4a6e" font-family="ui-monospace, monospace" font-size="12">/run/secrets/sql.password</text>

  <rect x="24" y="212" width="210" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="129" y="238" text-anchor="middle" font-weight="600" fill="#78350f">3. Stored in the world</text>
  <text x="129" y="260" text-anchor="middle" fill="#78350f" font-size="12">encrypted, set with @secret</text>

  <path d="M129 88 L129 116" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="139" y="107" fill="#475569" font-size="12">not set</text>
  <path d="M129 182 L129 210" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="139" y="201" fill="#475569" font-size="12">not set</text>

  <rect x="300" y="212" width="190" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-dasharray="5 3"/>
  <text x="395" y="238" text-anchor="middle" font-weight="600" fill="#78350f">Key ring</text>
  <text x="395" y="260" text-anchor="middle" fill="#78350f" font-size="12">beside the world, not in it</text>
  <path d="M298 244 L236 244" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="267" y="236" text-anchor="middle" fill="#475569" font-size="12">decrypts</text>

  <rect x="540" y="118" width="196" height="64" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="638" y="144" text-anchor="middle" font-weight="600" fill="#14532d">Server code</text>
  <text x="638" y="166" text-anchor="middle" fill="#14532d" font-size="12">gets the first value found</text>

  <path d="M236 56 L520 56 L600 116" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M236 150 L536 150" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M492 230 L520 230 L600 184" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
</svg>
