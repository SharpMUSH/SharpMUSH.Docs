<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="t d">
<title id="t">A player's area joined to the grid</title>
<desc id="d">Market Square is on the grid, owned by staff. Mira's area, Clockmaker's Workshop and Back Garden, is joined by exits Mira opened with @dig. Staff open the two exits between Market Square and the workshop once the Building job is approved.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--dg-text)"/></marker>
<marker id="arrow-staff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--dg-amber-ink)"/></marker>
</defs>
<rect x="0" y="0" width="860" height="330" rx="12" style="fill:var(--dg-canvas)"/>
<g font-family="system-ui, sans-serif" style="fill:var(--dg-text)">
<rect x="20" y="40" width="220" height="250" rx="10" style="fill:var(--dg-surface);stroke:var(--dg-line)"/>
<text x="130" y="28" text-anchor="middle" font-size="15" font-weight="600">The grid (staff own it)</text>
<rect x="45" y="130" width="170" height="64" rx="8" style="fill:var(--dg-card);stroke:var(--dg-muted)"/>
<text x="130" y="158" text-anchor="middle" font-size="15" font-weight="600">Market Square</text>
<text x="130" y="178" text-anchor="middle" font-size="13" style="fill:var(--dg-muted)">#30</text>
<rect x="450" y="40" width="390" height="250" rx="10" style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-line)"/>
<text x="645" y="28" text-anchor="middle" font-size="15" font-weight="600">Mira's area (her quota)</text>
<rect x="470" y="130" width="190" height="64" rx="8" style="fill:var(--dg-card);stroke:var(--dg-blue-ink)"/>
<text x="565" y="158" text-anchor="middle" font-size="15" font-weight="600">Clockmaker's Workshop</text>
<text x="565" y="178" text-anchor="middle" font-size="13" style="fill:var(--dg-muted)">#31</text>
<rect x="695" y="130" width="130" height="64" rx="8" style="fill:var(--dg-card);stroke:var(--dg-blue-ink)"/>
<text x="760" y="158" text-anchor="middle" font-size="15" font-weight="600">Back Garden</text>
<text x="760" y="178" text-anchor="middle" font-size="13" style="fill:var(--dg-muted)">#32</text>
<line x1="662" y1="150" x2="691" y2="150" stroke-width="2" marker-end="url(#arrow)" style="stroke:var(--dg-text)"/>
<line x1="693" y1="176" x2="664" y2="176" stroke-width="2" marker-end="url(#arrow)" style="stroke:var(--dg-text)"/>
<text x="678" y="228" text-anchor="middle" font-size="13">Garden &lt;G&gt; and Workshop &lt;W&gt;,</text>
<text x="678" y="246" text-anchor="middle" font-size="13">opened by Mira's @dig</text>
<line x1="218" y1="150" x2="466" y2="150" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-staff)" style="stroke:var(--dg-amber-ink)"/>
<line x1="466" y1="176" x2="220" y2="176" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-staff)" style="stroke:var(--dg-amber-ink)"/>
<text x="343" y="140" text-anchor="middle" font-size="13" style="fill:var(--dg-amber-ink)">Clockmaker's Workshop &lt;C&gt;</text>
<text x="343" y="200" text-anchor="middle" font-size="13" style="fill:var(--dg-amber-ink)">Market Square &lt;M&gt;</text>
<text x="430" y="315" text-anchor="middle" font-size="13" style="fill:var(--dg-amber-ink)">Dashed: opened by staff once the Building job is done</text>
</g>
</svg>
