<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
  <title id="t">What an upgrade does with each attribute</title>
  <desc id="d">An upgrade compares three values for each attribute: what the package installed, what the game has now, and what the new version ships. If only the package changed it, the new value is written. If only the game changed it, the game's value is kept. If both changed it on different lines, the lines are merged. If both changed the same lines, or a one-line value, the review page asks, with Keep mine chosen.</desc>
  <rect x="0" y="0" width="760" height="300" rx="12" style="fill:var(--dg-canvas)"/>
  <text x="24" y="36" font-weight="600" style="fill:var(--dg-text)">Who changed it since the package installed it?</text>

  <rect x="24" y="60" width="164" height="96" rx="8" style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-ink)"/>
  <text x="106" y="88" text-anchor="middle" font-weight="600" style="fill:var(--dg-blue-ink)">Only the package</text>
  <text x="106" y="112" text-anchor="middle" font-size="13" style="fill:var(--dg-blue-ink)">New value written</text>
  <text x="106" y="132" text-anchor="middle" font-size="12" style="fill:var(--dg-blue-ink)">AutoUpgrade</text>

  <rect x="204" y="60" width="164" height="96" rx="8" style="fill:var(--dg-green-fill);stroke:var(--dg-green-ink)"/>
  <text x="286" y="88" text-anchor="middle" font-weight="600" style="fill:var(--dg-green-ink)">Only the game</text>
  <text x="286" y="112" text-anchor="middle" font-size="13" style="fill:var(--dg-green-ink)">Game's value kept</text>
  <text x="286" y="132" text-anchor="middle" font-size="12" style="fill:var(--dg-green-ink)">KeepLocal</text>

  <rect x="384" y="60" width="164" height="96" rx="8" style="fill:var(--dg-green-fill);stroke:var(--dg-green-ink)"/>
  <text x="466" y="84" text-anchor="middle" font-weight="600" style="fill:var(--dg-green-ink)">Both, on</text>
  <text x="466" y="102" text-anchor="middle" font-weight="600" style="fill:var(--dg-green-ink)">different lines</text>
  <text x="466" y="124" text-anchor="middle" font-size="13" style="fill:var(--dg-green-ink)">Lines merged</text>
  <text x="466" y="144" text-anchor="middle" font-size="12" style="fill:var(--dg-green-ink)">Merge</text>

  <rect x="564" y="60" width="172" height="96" rx="8" style="fill:var(--dg-amber-fill);stroke:var(--dg-amber-ink)"/>
  <text x="650" y="84" text-anchor="middle" font-weight="600" style="fill:var(--dg-amber-ink)">Both, on the</text>
  <text x="650" y="102" text-anchor="middle" font-weight="600" style="fill:var(--dg-amber-ink)">same lines</text>
  <text x="650" y="124" text-anchor="middle" font-size="13" style="fill:var(--dg-amber-ink)">You choose</text>
  <text x="650" y="144" text-anchor="middle" font-size="12" style="fill:var(--dg-amber-ink)">Keep mine is preselected</text>

  <text x="24" y="196" font-size="13" style="fill:var(--dg-text)">The last three are listed under "Changed by this game" on the review page.</text>
  <text x="24" y="220" font-size="13" style="fill:var(--dg-text)">A one-line value both sides changed always counts as the same lines. Locks follow the same rules.</text>
  <text x="24" y="244" font-size="13" style="fill:var(--dg-text)">Whatever is chosen, the package's new value becomes the base for the next upgrade,</text>
  <text x="24" y="264" font-size="13" style="fill:var(--dg-text)">so a kept edit stays the game's own and is not asked about again until the package changes it again.</text>
</svg>
