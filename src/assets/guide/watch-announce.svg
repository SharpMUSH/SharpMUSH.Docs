<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-labelledby="t d">
<title id="t">Who hears that a player connected</title>
<desc id="d">When Mira connects, three checks about Mira come first: Mira has not hidden from watchers, is not DARK or connected hidden, and no connect of Mira's was announced in the last five minutes. If any fails, nobody is told. Then each person watching Mira is checked: they are connected, they have not muted their watch list, and Mira's page lock lets them through. Those who pass are told Mira has connected. Mira's disconnect is announced only when the connect was.</desc>
<rect width="780" height="430" rx="12" style="fill:var(--dg-canvas)"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" style="fill:var(--dg-muted)"/>
  </marker>
</defs>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" style="fill:var(--dg-text)">
  <rect x="300" y="20" width="180" height="40" rx="8" style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-line)"/>
  <text x="390" y="45" text-anchor="middle" font-weight="600">Mira connects</text>

  <text x="40" y="96" font-size="15" font-weight="600">About Mira</text>
  <rect x="40" y="108" width="700" height="110" rx="8" style="fill:var(--dg-card);stroke:var(--dg-line-soft)"/>
  <text x="60" y="138">1. Mira has not typed <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+watch/hide</tspan>.</text>
  <text x="60" y="166">2. Mira is not DARK, and did not connect hidden.</text>
  <text x="60" y="194">3. No connect of Mira's was announced in the last five minutes.</text>
  <text x="560" y="166" style="fill:var(--dg-red-ink)">Any fails: nobody</text>
  <text x="560" y="186" style="fill:var(--dg-red-ink)">is told.</text>

  <text x="40" y="256" font-size="15" font-weight="600">About each person watching Mira</text>
  <rect x="40" y="268" width="700" height="110" rx="8" style="fill:var(--dg-card);stroke:var(--dg-line-soft)"/>
  <text x="60" y="298">4. They are connected.</text>
  <text x="60" y="326">5. They have not typed <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">+watch/mute</tspan>.</text>
  <text x="60" y="354">6. Mira's page lock lets them through.</text>
  <text x="560" y="314" style="fill:var(--dg-green-ink)">All pass: they hear</text>
  <text x="560" y="334" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" style="fill:var(--dg-green-ink)">[WATCH] Mira has</text>
  <text x="560" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" style="fill:var(--dg-green-ink)">connected.</text>

  <line x1="390" y1="60" x2="390" y2="104" stroke-width="2" marker-end="url(#arrow)" style="stroke:var(--dg-muted)"/>
  <line x1="390" y1="218" x2="390" y2="264" stroke-width="2" marker-end="url(#arrow)" style="stroke:var(--dg-muted)"/>
  <text x="400" y="246" font-size="13" style="fill:var(--dg-muted)">all pass</text>

  <text x="40" y="408" font-size="13" style="fill:var(--dg-muted)">Mira's disconnect goes to the same people, and only when the connect was announced.</text>
</g>
</svg>
