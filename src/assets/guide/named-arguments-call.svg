<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">How a call's arguments become named arguments</title>
  <desc id="d">After @function/args pick=value case...|result... default, the call pick(b,a,1,b,2,none) passes b as value; a, 1, b and 2 are dealt out in turn as case1, result1, case2 and result2, with casecount and resultcount 2; and none, the argument left over after whole pairs, becomes default. The attribute reads each as %&lt;name&gt;.</desc>
  <rect x="0" y="0" width="960" height="330" rx="12" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="480" y="40" text-anchor="middle" font-size="15" font-family="ui-monospace, monospace">@function/args pick=value case...|result... default</text>

    <!-- the call -->
    <text x="140" y="104" text-anchor="end" font-size="15" font-weight="600">The call</text>
    <text x="160" y="104" font-size="18" font-family="ui-monospace, monospace">pick(</text>
    <g font-size="18" font-family="ui-monospace, monospace" text-anchor="middle">
      <rect x="225" y="80" width="60" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="255" y="104">b</text>
      <rect x="315" y="80" width="60" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="345" y="104">a</text>
      <rect x="405" y="80" width="60" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="435" y="104">1</text>
      <rect x="495" y="80" width="60" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="525" y="104">b</text>
      <rect x="585" y="80" width="60" height="36" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="615" y="104">2</text>
      <rect x="675" y="80" width="80" height="36" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
      <text x="715" y="104">none</text>
    </g>
    <text x="765" y="104" font-size="18" font-family="ui-monospace, monospace">)</text>

    <!-- arrows -->
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <line x1="255" y1="118" x2="255" y2="196"/>
      <line x1="345" y1="118" x2="345" y2="196"/>
      <line x1="435" y1="118" x2="435" y2="196"/>
      <line x1="525" y1="118" x2="525" y2="196"/>
      <line x1="615" y1="118" x2="615" y2="196"/>
      <line x1="715" y1="118" x2="715" y2="196"/>
    </g>

    <!-- the names -->
    <text x="140" y="224" text-anchor="end" font-size="15" font-weight="600">Read as</text>
    <g font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">
      <text x="255" y="224">%&lt;value&gt;</text>
      <text x="345" y="224">%&lt;case1&gt;</text>
      <text x="435" y="224">%&lt;result1&gt;</text>
      <text x="525" y="224">%&lt;case2&gt;</text>
      <text x="615" y="224">%&lt;result2&gt;</text>
      <text x="715" y="224">%&lt;default&gt;</text>
    </g>

    <g font-size="13" fill="#475569" text-anchor="middle">
      <text x="255" y="252">named before</text>
      <text x="480" y="252">dealt out in turn, a pair at a time</text>
      <text x="480" y="272">%&lt;casecount&gt; and %&lt;resultcount&gt; are 2</text>
      <text x="715" y="252">left over after</text>
      <text x="715" y="272">whole pairs</text>
    </g>
    <line x1="315" y1="236" x2="645" y2="236" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
