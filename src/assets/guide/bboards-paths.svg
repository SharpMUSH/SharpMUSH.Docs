<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" role="img" aria-labelledby="t d">
<title id="t">How the path 5/3/7 walks the board tree</title>
<desc id="d">The top level holds two category headings, Official with boards 1 Announcements, 2 Policy and 3 Staff, and Community with boards 4 Events, 5 Public and 6 Marketplace. Public holds two boards, 1 General and 2 Looking for RP, and then its posts, which start at 3. Post 3, Long thread, holds comments 1 to 7. The path 5/3/7 picks board 5 at the top, then item 3 inside Public, which is its first post, then comment 7 on that post.</desc>
<rect width="780" height="520" rx="12" fill="#f8fafc"/>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#1e293b">
  <text x="24" y="38" font-size="15" font-weight="600">The top level</text>
  <text x="470" y="38" font-size="15" font-weight="600">Reading the path</text>
  <text x="470" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#1d4ed8">+bbread 5/3/7</text>

  <!-- category headings -->
  <text x="40" y="78" font-weight="700" fill="#475569">Official</text>
  <text x="40" y="190" font-weight="700" fill="#475569">Community</text>

  <!-- top-level boards -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="56" y="106">1  Announcements</text>
    <text x="56" y="134">2  Policy</text>
    <text x="56" y="162">3  Staff</text>
    <text x="56" y="218">4  Events</text>
    <rect x="48" y="230" width="300" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="56" y="248" font-weight="700" fill="#1d4ed8">5  Public</text>

    <!-- inside Public -->
    <text x="88" y="276">1  General</text>
    <text x="88" y="304">2  Looking for RP</text>
    <rect x="80" y="314" width="268" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="88" y="332" font-weight="700" fill="#1d4ed8">3  Long thread</text>

    <!-- comments on post 3 -->
    <text x="120" y="360" fill="#64748b">[1] ... [6]</text>
    <rect x="112" y="370" width="236" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
    <text x="120" y="388" font-weight="700" fill="#1d4ed8">[7] a comment</text>

    <text x="88" y="416">4  Another post</text>
    <text x="56" y="444">6  Marketplace</text>
  </g>

  <!-- kind tags -->
  <g font-size="12" fill="#64748b" text-anchor="end">
    <text x="340" y="106">board</text>
    <text x="340" y="134">board</text>
    <text x="340" y="162">board</text>
    <text x="340" y="218">board</text>
    <text x="340" y="248" fill="#1d4ed8">board</text>
    <text x="340" y="276">board</text>
    <text x="340" y="304">board</text>
    <text x="340" y="332" fill="#1d4ed8">post</text>
    <text x="340" y="360">comments</text>
    <text x="340" y="388" fill="#1d4ed8">comment</text>
    <text x="340" y="416">post</text>
    <text x="340" y="444">board</text>
  </g>

  <!-- guide lines for nesting -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="none">
    <path d="M70 258 V412 H84"/>
    <path d="M70 272 H84"/>
    <path d="M70 300 H84"/>
    <path d="M70 328 H84"/>
    <path d="M102 342 V384 H116"/>
    <path d="M102 356 H116"/>
  </g>

  <!-- connectors to the explanations -->
  <g stroke="#2563eb" stroke-width="1.5" fill="none">
    <path d="M348 243 H462"/>
    <path d="M348 327 H462"/>
    <path d="M348 383 H462"/>
  </g>

  <!-- explanations -->
  <rect x="462" y="210" width="296" height="66" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="476" y="234" font-weight="700" fill="#1d4ed8">5</text>
  <text x="496" y="234">The fifth board at the top: Public.</text>
  <text x="496" y="254">Category headings take no number,</text>
  <text x="496" y="270">so numbers run on through them.</text>

  <rect x="462" y="290" width="296" height="70" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="476" y="314" font-weight="700" fill="#1d4ed8">3</text>
  <text x="496" y="314">The third item inside Public.</text>
  <text x="496" y="334">Its two boards come first, so</text>
  <text x="496" y="350">3 is its first post.</text>

  <rect x="462" y="370" width="296" height="48" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="476" y="398" font-weight="700" fill="#1d4ed8">7</text>
  <text x="496" y="398">Comment 7 on that post.</text>

  <text x="24" y="488" fill="#475569">A board lists its boards first, then pinned posts, then posts, oldest first,</text>
  <text x="24" y="506" fill="#475569">numbered down that one list. Nothing can follow a comment number.</text>
</g>
</svg>
