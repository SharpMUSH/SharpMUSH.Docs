<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d">
<title id="t">Three places of a graph map and the ways between them</title>
<desc id="d">Barrow at 0,0, Crossroads at 3,0 and Shrine at 1,3. Old Road leads from Barrow to Crossroads and Back Road leads back, drawn as two lines side by side. Shrine Path leads one way from Crossroads to Shrine and is a wall, drawn dotted. Long Track leads one way from Shrine to Barrow. A one-way way ends in an arrow.</desc>
<rect width="720" height="420" rx="12" fill="#f8fafc"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#1e293b">
  <line x1="196.0" y1="336.0" x2="514.0" y2="336.0" stroke="#475569" stroke-width="2.5"/>
  <text x="355.0" y="357.0" text-anchor="middle">Old Road</text>
  <line x1="514.0" y1="324.0" x2="196.0" y2="324.0" stroke="#475569" stroke-width="2.5"/>
  <text x="355.0" y="313.0" text-anchor="middle">Back Road</text>
  <line x1="535.3" y1="292.0" x2="324.7" y2="113.0" stroke="#475569" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#a)"/>
  <text x="440.4" y="195.3" text-anchor="start">Shrine Path (wall)</text>
  <line x1="257.6" y1="113.0" x2="152.4" y2="292.0" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="191.2" y="199.4" text-anchor="end">Long Track</text>
  <rect x="70.0" y="298.0" width="120" height="64" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="327" text-anchor="middle" font-weight="600">Barrow</text>
  <text x="130" y="346" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">0,0</text>
  <rect x="520.0" y="298.0" width="120" height="64" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="327" text-anchor="middle" font-weight="600">Crossroads</text>
  <text x="580" y="346" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">3,0</text>
  <rect x="220.0" y="43.0" width="120" height="64" rx="12" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="72" text-anchor="middle" font-weight="600">Shrine</text>
  <text x="280" y="91" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">1,3</text>
</g>
</svg>
