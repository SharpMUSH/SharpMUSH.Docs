<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="t d">
<title id="t">A hex place and its six neighbours</title>
<desc id="d">The place 0,0 in the middle, with its neighbours: 0,1 to the north, 1,0 to the northeast, 1,-1 to the southeast, 0,-1 to the south, -1,0 to the southwest and -1,1 to the northwest. The place 0,0 stores its north, northeast and southeast sides, drawn thick; its other three sides are stored by the neighbours across them, as their north, northeast and southeast sides.</desc>
