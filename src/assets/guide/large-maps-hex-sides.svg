  <text x="520" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">0,-1</text>
  <text x="600" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">n of 0,-1</text>
  <text x="470" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">sw</text>
  <text x="520" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">-1,0</text>
  <text x="600" y="238" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">ne of -1,0</text>
  <text x="470" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">nw</text>
  <text x="520" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">-1,1</text>
  <text x="600" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="fill:var(--dg-text)">se of -1,1</text>
  <text x="470" y="312" font-size="13" style="fill:var(--dg-muted)">u and d lead a level up and down,</text>
  <text x="470" y="330" font-size="13" style="fill:var(--dg-muted)">as on a square map.</text>
