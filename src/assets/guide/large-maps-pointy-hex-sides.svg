<title id="t">A pointy hex place, its six neighbours and its corner steps</title>
<desc id="d">The place 0,0 in the middle, with its neighbours: 0,1 to the northeast, 1,0 to the east, 1,-1 to the southeast, 0,-1 to the southwest, -1,0 to the west and -1,1 to the northwest. The place 0,0 stores its northeast, east and southeast sides, drawn thick; its other three sides are stored by the neighbours across them. North and south face corners: north leads round the top corner to -1,2, and south round the bottom corner to 1,-2.</desc>
